{% extends "diary/base.html" %}
{% block title %}Удалить запись{% endblock %}

{% block content %}
    <h1 class="page-title mb-4">Удалить запись?</h1>
    <p>
        Вы уверены, что хотите удалить «<strong>{{ object.title }}</strong>»?
        Это действие необратимо.
    </p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <!-- ★ Скрытое поле для возврата на предыдущую страницу -->
        <input type="hidden" name="next" value="{{ request.META.HTTP_REFERER }}">

        <button type="submit" class="btn btn-danger rounded-pill">Удалить</button>
        <a href="{{ object.get_absolute_url }}" class="btn btn-outline-secondary rounded-pill">Отмена</a>
    </form>
{% endblock %}
