{% extends "diary/base.html" %}
{% block title %}Удалить запись{% endblock %}

{% block content %}
    <div class="page-header" style="margin-bottom: 30px;">
        <h1 class="page-title" style="font-size: 28px; font-weight: 700;">
            Удалить запись?
        </h1>
    </div>

    <div class="card p-4 mb-4" style="background: var(--paper); border: 1px solid var(--border-color); border-radius: 10px; max-width: 600px;">
        <p class="mb-2">
            Вы уверены, что хотите удалить «<strong>{{ object.title|default:"Без названия" }}</strong>»?
        </p>
        <p class="text-muted small mb-0">
            <em>Это действие необратимо.</em>
        </p>
    </div>

    <form method="post">
        {% csrf_token %}
        <!-- ★ Скрытое поле для возврата на предыдущую страницу -->
        <input type="hidden" name="next" value="{{ request.META.HTTP_REFERER }}">

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-danger rounded-pill" style="background-color: #c98b8b; border: none;">Удалить</button>
            <a href="{% if object.notebook %}{% url 'diary:entry_list' %}?notebook={{ object.notebook.id }}{% else %}{% url 'diary:entry_list' %}{% endif %}" class="btn btn-outline-secondary rounded-pill">
                Отмена
            </a>
        </div>
    </form>
{% endblock %}
