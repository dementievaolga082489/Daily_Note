{% extends "diary/base.html" %}
{% block title %}Удалить дневник{% endblock %}

{% block content %}
    <div class="page-header">
        <h1 class="page-title">Удалить дневник?</h1>
    </div>
    <p>
        Удалить папку «<strong>{{ object.title }}</strong>»?
        Записи внутри не останутся привязанными к папке, но <strong>не удалятся</strong>.
    </p>
    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn-mint" style="background:#c98b8b;color:#fff;">Удалить</button>
        <a href="{% url 'diary:entry_list' %}" class="btn-ghost">Отмена</a>
    </form>
{% endblock %}
