{% extends "diary/base.html" %}
{% block title %}Удалить напоминание{% endblock %}

{% block content %}
    <div class="page-header">
        <h1 class="page-title">Удалить напоминание?</h1>
    </div>

    <p>Удалить «<strong>{{ object.title }}</strong>»?</p>

    <form method="post" class="mt-4">
        {% csrf_token %}
        <button type="submit" class="btn-mint" style="background:#c98b8b;color:#fff;">
            Удалить
        </button>
        <a href="{% url 'diary:calendar' %}" class="btn-ghost">Отмена</a>
    </form>
{% endblock %}
