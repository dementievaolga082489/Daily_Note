server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /static/ {
        alias /app/staticfiles/;
    }

    location / {
        set $backend "http://web:8000";
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}