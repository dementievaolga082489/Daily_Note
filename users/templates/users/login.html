{% extends "diary/base.html" %}
{% block title %}Вход{% endblock %}

{% block content %}
    <div class="page-header">
        <h1 class="page-title">Вход</h1>
    </div>

    <form method="post" style="max-width: 460px;" novalidate>
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger">{{ form.non_field_errors }}</div>
        {% endif %}

        {% for field in form %}
            <div class="mb-3">
                <label class="form-label fw-semibold" for="{{ field.id_for_label }}">
                    {{ field.label }}
                </label>
                {{ field }}
                {{ field.errors }}
            </div>
        {% endfor %}

        <div class="d-flex gap-2 mt-4 flex-wrap align-items-center">
            <button type="submit" class="btn-mint">Войти</button>
            <a href="{% url 'users:register' %}" class="btn-ghost">Регистрация</a>
        </div>
    </form>
{% endblock %}
