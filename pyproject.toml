[project]
name = "daily-note"
version = "0.1.0"
description = "Веб-приложение для ведения личного дневника"
authors = [
    {name = "Olga",email = "08241989@mail.ru"}
]
requires-python = ">=3.12,<4.0"
dependencies = [
    "django (>=6.0,<6.1)",
    "python-dotenv (>=1.2.4,<2.0.0)",
    "psycopg2-binary (>=2.9)",
    "requests (>=2.34.2,<3.0.0)",
    "gunicorn (>=26.2.0,<27.0.0)",
    "celery (>=5.6.3,<6.0.0)",
    "redis (>=8.1.0,<9.0.0)",
    "pillow (>=13.0.0,<14.0.0)",
    "django-celery-beat (>=2.9.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
lint = [
    "flake8 (>=7.4.1,<8.0.0)",
    "black (>=26.10.1,<27.0.0)",
    "isort (>=9.0.2,<10.0.0)"
]

[tool.isort]
profile = "black"
line_length = 120

[tool.black]
line-length = 120
